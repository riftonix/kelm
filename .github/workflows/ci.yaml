name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  # renovate: datasource=repology depName=manjaro_stable/dagger
  DAGGER_VERSION: 0.21.11
  # renovate: datasource=github-tags depName=riftonix/daggerverse versioning=semver extractVersion=^scenarios/go-ci/v(?<version>.*)$
  GO_CI_SCENARIO: github.com/riftonix/daggerverse/scenarios/go-ci@scenarios/go-ci/v0.1.0

jobs:
  verify:
    name: Verify Go application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
      - name: Verify Go application
        run: dagger -m "$GO_CI_SCENARIO" call --source=. verify-app --package=./cmd/kelm

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ always() }}
    steps:
      - name: Check verification result
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
